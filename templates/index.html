<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IPAM Monitor</title>
   <title>IPAM Monitor</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <header>
            <div>
                <p class="eyebrow">NETWORK MANAGEMENT</p>
                <h1>IPAM Monitor</h1>
                <p class="subtitle">
                    Discover and monitor devices on your local network.
                </p>
            </div>

            <button id="scan-button">Scan Network</button>
        </header>

        <section class="summary">
            <div class="summary-card">
                <span class="summary-label">Status</span>
                <strong id="status">Ready to scan</strong>
            </div>

            <div class="summary-card">
                <span class="summary-label">Online devices</span>
                <strong id="device-count">0</strong>
            </div>

            <div class="summary-card">
                <span class="summary-label">Network</span>
                <strong>192.168.1.0/24</strong>
            </div>
        </section>

        <section class="dashboard">
            <div class="dashboard-heading">
                <div>
                    <h2>Discovered Devices</h2>
                    <p>Saved results from the latest network scan</p>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Status</th>
                            <th>IP Address</th>
                            <th>MAC Address</th>
                            <th>Trust</th>
                        </tr>
                    </thead>

                    <tbody id="device-list">
                        <tr>
                            <td colspan="4" class="empty-state">
                                Run a scan to discover devices.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const scanButton = document.getElementById("scan-button");
        const statusText = document.getElementById("status");
        const deviceCount = document.getElementById("device-count");
        const deviceList = document.getElementById("device-list");

        function sortDevices(devices) {
            return devices.sort((a, b) => {
                const aParts = a.ip_address.split(".").map(Number);
                const bParts = b.ip_address.split(".").map(Number);

                for (let i = 0; i < 4; i++) {
                    if (aParts[i] !== bParts[i]) {
                        return aParts[i] - bParts[i];
                    }
                }

                return 0;
            });
        }

        function displayDevices(devices) {
            deviceList.innerHTML = "";

            if (devices.length === 0) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");

                cell.colSpan = 4;
                cell.className = "empty-state";
                cell.textContent = "No saved devices found.";

                row.appendChild(cell);
                deviceList.appendChild(row);
                deviceCount.textContent = "0";
                return;
            }

            sortDevices(devices).forEach(device => {
                const row = document.createElement("tr");

                const statusCell = document.createElement("td");
                const statusBadge = document.createElement("span");

                statusBadge.className = device.online
                    ? "status-badge online"
                    : "status-badge offline";

                statusBadge.textContent = device.online ? "Online" : "Offline";
                statusCell.appendChild(statusBadge);

                const ipCell = document.createElement("td");
                ipCell.textContent = device.ip_address;

                const macCell = document.createElement("td");
                macCell.textContent = device.mac_address;

                const trustCell = document.createElement("td");
                const trustBadge = document.createElement("span");

                trustBadge.className = `trust-badge ${device.trust_status}`;
                trustBadge.textContent = device.trust_status;

                trustCell.appendChild(trustBadge);

                row.append(statusCell, ipCell, macCell, trustCell);
                deviceList.appendChild(row);
            });

            const onlineCount = devices.filter(device => device.online).length;
            deviceCount.textContent = onlineCount;
        }

        async function loadDevices() {
            try {
                const response = await fetch("/devices");

                if (!response.ok) {
                    throw new Error("Device request failed");
                }

                const devices = await response.json();
                displayDevices(devices);
            } catch (error) {
                statusText.textContent = "Could not load devices";
            }
        }

        scanButton.addEventListener("click", async () => {
            scanButton.disabled = true;
            scanButton.textContent = "Scanning...";
            statusText.textContent = "Scanning";

            try {
                const response = await fetch("/scan");

                if (!response.ok) {
                    throw new Error("Scan request failed");
                }

                const devices = await response.json();

                // Refresh the table with saved results
                displayDevices(devices);
                statusText.textContent = "Scan complete";
            } catch (error) {
                statusText.textContent = "Scan failed";
            } finally {
                scanButton.disabled = false;
                scanButton.textContent = "Scan Network";
            }
        });

        loadDevices();
    </script>
</body>
</html>
