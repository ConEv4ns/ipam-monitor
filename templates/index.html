<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPAM Monitor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <header>
            <div>
                <p class="eyebrow">NETWORK MANAGEMENT</p>
                <h1>IPAM Monitor</h1>
                <p class="subtitle">
                    Discover active devices on your local network.
                </p>
            </div>

            <button id="scan-button">Scan Network</button>
        </header>

        <section class="summary">
            <div class="summary-card">
                <span class="summary-label">Status</span>
                <strong id="status">Ready to scan</strong>
            </div>

            <div class="summary-card">
                <span class="summary-label">Devices found</span>
                <strong id="device-count">0</strong>
            </div>

            <div class="summary-card">
                <span class="summary-label">Network</span>
                <strong>192.168.1.0/24</strong>
            </div>
        </section>

        <section class="dashboard">
            <div class="dashboard-heading">
                <div>
                    <h2>Discovered Devices</h2>
                    <p>Results from the latest network scan</p>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>IP Address</th>
                            <th>MAC Address</th>
                        </tr>
                    </thead>
                    <tbody id="device-list">
                        <tr id="empty-row">
                            <td colspan="2" class="empty-state">
                                Run a scan to discover devices.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const scanButton = document.getElementById("scan-button");
        const statusText = document.getElementById("status");
        const deviceCount = document.getElementById("device-count");
        const deviceList = document.getElementById("device-list");

        scanButton.addEventListener("click", async () => {
            scanButton.disabled = true;
            scanButton.textContent = "Scanning...";
            statusText.textContent = "Scanning";

            try {
                const response = await fetch("/scan");

                if (!response.ok) {
                    throw new Error("Scan request failed");
                }

                const devices = await response.json();

                // Sort devices by IP address
                devices.sort((a, b) => {
                    const aParts = a.ip.split(".").map(Number);
                    const bParts = b.ip.split(".").map(Number);

                    for (let i = 0; i < 4; i++) {
                        if (aParts[i] !== bParts[i]) {
                            return aParts[i] - bParts[i];
                        }
                    }

                    return 0;
                });

                deviceList.innerHTML = "";

                devices.forEach(device => {
                    const row = document.createElement("tr");

                    const ipCell = document.createElement("td");
                    ipCell.textContent = device.ip;

                    const macCell = document.createElement("td");
                    macCell.textContent = device.mac;

                    row.append(ipCell, macCell);
                    deviceList.appendChild(row);
                });

                if (devices.length === 0) {
                    deviceList.innerHTML = `
                        <tr>
                            <td colspan="2" class="empty-state">
                                No active devices found.
                            </td>
                        </tr>
                    `;
                }

                deviceCount.textContent = devices.length;
                statusText.textContent = "Scan complete";
            } catch (error) {
                statusText.textContent = "Scan failed";
                deviceCount.textContent = "0";
            } finally {
                scanButton.disabled = false;
                scanButton.textContent = "Scan Network";
            }
        });
    </script>
</body>
</html>
